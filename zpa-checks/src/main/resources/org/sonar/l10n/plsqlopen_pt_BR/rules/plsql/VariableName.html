<p>
Essa regra verifica se os nomes de todas as variáveis são aceitos na expressão regular fornecida.
</p>

<!-- section: fix -->
<h2>Exemplo</h2>

<p>Considerando a expressão regular padrão:</p>

<pre>
DECLARE
  dept_name dept.name%type; -- Conforme
  dept_name_ dept.name%type; -- Não conforme
BEGIN
  ...
END;
</pre>
