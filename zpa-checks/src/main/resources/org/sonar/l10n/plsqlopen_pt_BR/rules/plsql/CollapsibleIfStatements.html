<p>
Una comandos <code>if</code> aninhados para melhorar a legibilidade do código.
</p>

<!-- section: fix -->
<h2>Exemplo de código não conforme</h2>

<pre data-diff-id="1" data-diff-type="noncompliant">
if condition1 then
  if condition2 then
    -- code
  end if;
end if;
</pre>

<h2>Solução conforme</h2>

<pre data-diff-id="1" data-diff-type="compliant">
if condition1 and condition2 then
  -- code
end if;
</pre>
