name: Build

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: 21

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true

      - name: Validate stable Release PR dependency version
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          base_version=$(git show "${BASE_SHA}:gradle.properties" | sed -n 's/^version=//p')
          head_version=$(sed -n 's/^version=//p' gradle.properties)
          if [[ ${base_version} != "${head_version}" && ${head_version} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flr_version=$(sed -n 's/^flr = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
            [[ ${flr_version} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              printf 'Stable Release PR requires a stable flr version in gradle/libs.versions.toml, got %s\n' "${flr_version}" >&2
              exit 1
            }
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Cache SQLcl distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zpa-checks/tools/sqlcl-*.zip
          key: sqlcl-${{ hashFiles('zpa-checks/build.gradle.kts') }}

      - name: Build with Gradle
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: ./gradlew build publishToMavenLocal --refresh-dependencies

      - name: Build with Gradle and prepare Maven staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew build publishToMavenLocal publish --refresh-dependencies

      - name: Run zpa-checks integration tests
        run: |
          ./gradlew :zpa-checks:integrationTest --rerun
          cat zpa-checks/build/integrationTest/progress-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Build custom rules example
        run: ./gradlew build -p plsql-custom-rules --refresh-dependencies

      - name: Upload SonarQube integration-test plugins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonarqube-it-plugins
          path: |
            sonar-zpa-plugin/build/libs/sonar-zpa-plugin-*.jar
            !sonar-zpa-plugin/build/libs/*-sources.jar
            !sonar-zpa-plugin/build/libs/*-javadoc.jar
            plsql-custom-rules/build/libs/plsql-custom-rules-*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload Maven staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maven-staging
          path: build/staging-deploy/
          retention-days: 1
          if-no-files-found: error

  integration-tests:
    name: IT
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/integration-tests.yml
    secrets:
      OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
      OCI_PAR: ${{ secrets.OCI_PAR }}

  sonar:
    name: SonarQube analysis
    permissions:
      contents: read
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Prepare SonarQube analysis inputs
        run: ./gradlew test

      - name: Run SonarQube Scanner
        run: ./gradlew sonar --info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  publish-snapshot:
    name: Snapshot publication
    permissions:
      contents: read
    needs: [integration-tests, sonar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    concurrency:
      group: zpa-maven-publication-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true

      - name: Download Maven staging
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: maven-staging
          path: build/staging-deploy

      - name: Detect project version
        id: version
        shell: bash
        run: |
          version="$(awk -F= '$1 == "version" { print $2; exit }' gradle.properties)"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            is_snapshot=true
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_snapshot=false
          else
            echo "Unsupported project version: $version" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "is_snapshot=$is_snapshot"
          } >> "$GITHUB_OUTPUT"

      - name: Publish snapshot to Maven repositories
        if: steps.version.outputs.is_snapshot == 'true'
        run: ./gradlew jreleaserDeploy
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          JRELEASER_NEXUS2_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          JRELEASER_NEXUS2_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_KEY_PASSWORD }}

  dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
