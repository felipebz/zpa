name: Integration tests

# The SonarQube integration tests of the plugin and the Oracle database tests, shared by the build and the release.
# The SonarQube versions below are the ones the plugin supports: keep them in line with the compatibility matrix.
# The caller uploads the `sonarqube-it-plugins` artifact (the plugin and the custom rules example) before calling.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test; the commit of the caller when empty.
        type: string
        default: ''
    secrets:
      OCI_NAMESPACE:
        required: true
      OCI_PAR:
        required: true

permissions:
  contents: read

env:
  JAVA_VERSION: 21

jobs:
  plugin:
    name: Plugin IT (${{ matrix.sqVersion }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        sqVersion:
          - 26.7.0.124771
          - 26.9.0.129388
          - 26.10.0.133078
          - 26.11.0.134175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true

      - name: Download SonarQube integration-test plugins
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sonarqube-it-plugins

      - name: Cache SonarQube distribution
        if: ${{ !contains(matrix.sqVersion, 'SNAPSHOT') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sonar-zpa-plugin/sonar-application-${{ matrix.sqVersion }}.zip
          key: sonarqube-${{ matrix.sqVersion }}

      - name: Run plugin integration test
        run: |
          if [[ "$SQ_VERSION" == *"SNAPSHOT"* ]]; then
            FOLDER="snapshots"
          else
            FOLDER="releases"
          fi

          FILE_NAME="sonar-application-${SQ_VERSION}.zip"
          if [[ ! -f "sonar-zpa-plugin/${FILE_NAME}" ]]; then
            DOWNLOAD_URL="https://$OCI_NAMESPACE.objectstorage.sa-saopaulo-1.oci.customer-oci.com/p/$OCI_PAR/n/$OCI_NAMESPACE/b/build-artifacts/o/${FOLDER}/${FILE_NAME}"
            curl -s -L -f -o "sonar-zpa-plugin/${FILE_NAME}" "$DOWNLOAD_URL"
          fi
          ./gradlew :sonar-zpa-plugin:integrationTest -Dsonar.zipFile=$FILE_NAME --rerun --info
        env:
          SQ_VERSION: ${{ matrix.sqVersion }}
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
          OCI_PAR: ${{ secrets.OCI_PAR }}

  oracle:
    name: Oracle IT
    runs-on: ubuntu-26.04
    env:
      SQ_VERSION: 26.11.0.134175
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true

      - name: Cache SonarQube distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sonar-zpa-plugin/sonar-application-${{ env.SQ_VERSION }}.zip
          key: sonarqube-${{ env.SQ_VERSION }}

      # Both suites start their Oracle container themselves (Testcontainers, image pinned in gradle.properties).
      - name: Run Oracle integration tests
        run: |
          FILE_NAME="sonar-application-${SQ_VERSION}.zip"
          if [[ ! -f "sonar-zpa-plugin/${FILE_NAME}" ]]; then
            DOWNLOAD_URL="https://$OCI_NAMESPACE.objectstorage.sa-saopaulo-1.oci.customer-oci.com/p/$OCI_PAR/n/$OCI_NAMESPACE/b/build-artifacts/o/releases/${FILE_NAME}"
            curl -s -L -f -o "sonar-zpa-plugin/${FILE_NAME}" "$DOWNLOAD_URL"
          fi
          ./gradlew :zpa-oracle-metadata:oracleIntegrationTest :sonar-zpa-plugin:oracleIntegrationTest -Dsonar.zipFile=$FILE_NAME --continue
        env:
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
          OCI_PAR: ${{ secrets.OCI_PAR }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oracle-integration-test-reports
          path: |
            zpa-oracle-metadata/build/reports/tests/oracleIntegrationTest/
            sonar-zpa-plugin/build/reports/tests/oracleIntegrationTest/
          retention-days: 7
          if-no-files-found: ignore
