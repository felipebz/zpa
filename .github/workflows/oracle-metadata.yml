name: Oracle metadata

on:
  push:
    branches:
      - main
    paths:
      - zpa-oracle-metadata/**
      - zpa-core/src/main/kotlin/com/felipebz/zpa/api/project/**
      - gradle/libs.versions.toml
      - gradle.properties
      - .github/workflows/oracle-metadata.yml
  pull_request:
    branches:
      - main
    paths:
      - zpa-oracle-metadata/**
      - zpa-core/src/main/kotlin/com/felipebz/zpa/api/project/**
      - gradle/libs.versions.toml
      - gradle.properties
      - .github/workflows/oracle-metadata.yml
  schedule:
    # Weekly, to notice changes in the database image or the JDBC driver that no pull request triggers.
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  JAVA_VERSION: 21

permissions:
  contents: read

jobs:
  oracle-integration-tests:
    name: Oracle metadata integration tests
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # The tests start the Oracle container themselves (Testcontainers, image pinned in gradle.properties).
      - name: Run Oracle metadata integration tests
        run: ./gradlew :zpa-oracle-metadata:oracleIntegrationTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oracle-metadata-test-reports
          path: zpa-oracle-metadata/build/reports/tests/oracleIntegrationTest/
          retention-days: 7
          if-no-files-found: ignore
